<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ImageConverter</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #15202b;
      background: #f4f7fb;
    }

    main {
      width: min(880px, calc(100% - 2rem));
      margin: 2rem auto;
    }

    h1 {
      margin: 0 0 0.35rem;
      font-size: 2rem;
    }

    .lead {
      margin: 0 0 1.25rem;
      color: #4b5b6c;
    }

    .samples {
      margin: 0 0 1.25rem;
      padding: 1rem 1.25rem;
      background: #fff;
      border: 1px solid #d7e0ea;
      border-radius: 12px;
    }

    .samples ul {
      margin: 0;
      padding-left: 1.2rem;
    }

    .samples li {
      margin: 0.25rem 0;
    }

    form {
      display: grid;
      gap: 1rem;
      padding: 1.25rem;
      background: #fff;
      border: 1px solid #d7e0ea;
      border-radius: 12px;
    }

    .row {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    }

    label {
      display: grid;
      gap: 0.4rem;
      font-size: 0.95rem;
      color: #4b5b6c;
    }

    input, select, button {
      font: inherit;
    }

    input[type="file"],
    input[type="number"],
    select {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border: 1px solid #c5d0db;
      border-radius: 8px;
      background: #fff;
      color: #15202b;
    }

    button {
      justify-self: start;
      padding: 0.75rem 1.25rem;
      border: 0;
      border-radius: 8px;
      background: #0b6bcb;
      color: #fff;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .status {
      min-height: 1.25rem;
      color: #4b5b6c;
    }

    .status.error {
      color: #b42318;
    }

    .preview {
      display: none;
      margin-top: 1.25rem;
      padding: 1rem;
      background: #fff;
      border: 1px solid #d7e0ea;
      border-radius: 12px;
    }

    .preview.visible {
      display: block;
    }

    .preview img {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      background: repeating-conic-gradient(#e8eef5 0% 25%, #fff 0% 50%) 50% / 20px 20px;
    }

    .meta {
      margin-top: 0.75rem;
      color: #4b5b6c;
    }
  </style>
</head>
<body>
  <main>
    <h1>ImageConverter</h1>
    <p class="lead">Scale images true to aspect ratio. Supports AVIF and WebP.</p>

    <section class="samples" aria-label="Example images">
      <p class="lead" style="margin-bottom:0.5rem">Example images to try:</p>
      <ul>
        <li><a href="/samples/lake.webp" download>lake.webp</a></li>
        <li><a href="/samples/mountain.webp" download>mountain.webp</a></li>
        <li><a href="/samples/flowers.webp" download>flowers.webp</a></li>
        <li><a href="/samples/kimono.avif" download>kimono.avif</a></li>
        <li><a href="/samples/fox.avif" download>fox.avif</a></li>
      </ul>
    </section>

    <form id="convert-form">
      <label>
        Image
        <input id="file" name="file" type="file" accept="image/*,.avif,.webp" required />
      </label>

      <div class="row">
        <label>
          Width
          <input id="width" name="width" type="number" min="1" max="8192" placeholder="e.g. 800" />
        </label>
        <label>
          Height
          <input id="height" name="height" type="number" min="1" max="8192" placeholder="e.g. 600" />
        </label>
        <label>
          Format
          <select id="format" name="format">
            <option value="webp" selected>WebP</option>
            <option value="avif">AVIF</option>
            <option value="png">PNG</option>
            <option value="jpg">JPEG</option>
          </select>
        </label>
        <label>
          Quality
          <input id="quality" name="quality" type="number" min="1" max="100" value="85" />
        </label>
      </div>

      <button id="submit" type="submit">Convert</button>
      <div id="status" class="status" aria-live="polite"></div>
    </form>

    <section id="preview" class="preview" aria-label="Converted image preview">
      <img id="result-image" alt="Converted result" />
      <div id="meta" class="meta"></div>
      <p class="meta"><a id="download" download>Download converted image</a></p>
    </section>
  </main>

  <script>
    const form = document.getElementById("convert-form");
    const statusEl = document.getElementById("status");
    const submitBtn = document.getElementById("submit");
    const preview = document.getElementById("preview");
    const resultImage = document.getElementById("result-image");
    const meta = document.getElementById("meta");
    const download = document.getElementById("download");
    let objectUrl;

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      statusEl.classList.remove("error");
      statusEl.textContent = "Converting…";
      submitBtn.disabled = true;
      preview.classList.remove("visible");

      const data = new FormData(form);
      if (!data.get("width")) data.delete("width");
      if (!data.get("height")) data.delete("height");

      try {
        const response = await fetch("/convert", { method: "POST", body: data });
        if (!response.ok) {
          let message = `Conversion failed (${response.status})`;
          try {
            const payload = await response.json();
            if (payload.error) message = payload.error;
          } catch { /* keep default */ }
          throw new Error(message);
        }

        const blob = await response.blob();
        if (objectUrl) URL.revokeObjectURL(objectUrl);
        objectUrl = URL.createObjectURL(blob);

        const disposition = response.headers.get("Content-Disposition") || "";
        const match = /filename\*?=(?:UTF-8''|")?([^\";]+)/i.exec(disposition);
        const filename = match
          ? decodeURIComponent(match[1].replace(/"/g, ""))
          : `converted.${data.get("format") || "webp"}`;

        resultImage.src = objectUrl;
        download.href = objectUrl;
        download.download = filename;
        meta.textContent = `${filename} · ${(blob.size / 1024).toFixed(1)} KB · ${blob.type || "image"}`;
        preview.classList.add("visible");
        statusEl.textContent = "Done.";
      } catch (error) {
        statusEl.classList.add("error");
        statusEl.textContent = error.message || "Conversion failed.";
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
